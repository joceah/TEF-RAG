name: Build paper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-paper.yml

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out paper source
        uses: actions/checkout@v4
        with:
          ref: release/tef-rag-v6-paper
          path: source

      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: release

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-publishers

      - name: Compile paper
        working-directory: source/paper
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error TEF_RAG_ICRA_style_en_v2.tex

      - name: Publish compiled PDF
        run: |
          mkdir -p release/paper
          cp source/paper/TEF_RAG_ICRA_style_en_v2.pdf release/paper/TEF-RAG.pdf
          cd release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/TEF-RAG.pdf
          git commit -m "paper: publish compiled PDF" || exit 0
          git push origin HEAD:main
