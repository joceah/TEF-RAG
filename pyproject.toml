[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tef-rag"
version = "0.6.0"
description = "Temporal Evidence Flow retrieval for maintenance RAG"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy"]
semantic = ["numpy", "onnxruntime==1.29.0", "tokenizers==0.23.2"]
ranknet = ["numpy", "scikit-learn", "torch>=2.14"]
# Portable runtime packages used by the frozen V6 baseline environment.
# PyTorch is kept platform-flexible because the formal run used a CUDA-specific
# build (2.14.0+cu130); install the matching CPU/CUDA wheel for your machine.
reproduce = [
  "numpy==2.4.6",
  "torch>=2.14",
  "transformers==4.57.6",
  "sentence-transformers==5.7.0",
  "faiss-cpu==1.15.1",
  "ncls==0.0.68",
  "openai==3.14.1",
  "scikit-learn",
  "onnxruntime==1.29.0",
  "tokenizers==0.23.2",
]

[tool.setuptools]
packages = [
  "baseline_adapters",
  "tef_rag_v6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
