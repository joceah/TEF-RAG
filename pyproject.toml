[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tef-rag"
version = "0.5.0"
description = "Query-conditioned set-level temporal evidence selection for maintenance RAG"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
semantic = ["numpy", "onnxruntime==1.29.0", "tokenizers==0.23.2"]

[tool.setuptools]
packages = [
  "baseline_adapters",
  "tef_rag_v1",
  "tef_rag_v2",
  "tef_rag_v3",
  "tef_rag_v4",
  "tef_rag_v5",
  "tmc_rag_v3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
