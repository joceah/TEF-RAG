[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tef-rag"
version = "1.0.0"
description = "Temporal Evidence Flow retrieval for dynamic operation and maintenance RAG"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
semantic = ["numpy", "onnxruntime==1.29.0", "tokenizers==0.23.2"]
ranknet = ["numpy", "scikit-learn", "torch>=2.14"]
reproduce = [
  "numpy==2.4.6",
  "torch>=2.14",
  "transformers==4.57.6",
  "sentence-transformers==5.7.0",
  "faiss-cpu==1.15.1",
  "ncls==0.0.68",
  "openai==3.14.1",
  "scikit-learn",
  "onnxruntime==1.29.0",
  "tokenizers==0.23.2",
]

[tool.setuptools]
packages = ["tef_rag"]
