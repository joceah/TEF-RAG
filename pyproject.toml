[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tef-rag"
version = "0.6.0"
description = "Temporal Evidence Flow retrieval for maintenance RAG"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy"]
semantic = ["numpy", "onnxruntime==1.29.0", "tokenizers==0.23.2"]
ranknet = ["numpy", "scikit-learn", "torch>=2.14"]

[tool.setuptools]
packages = [
  "baseline_adapters",
  "tef_rag_v6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
